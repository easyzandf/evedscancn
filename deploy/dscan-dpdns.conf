server {
    listen 80;
    server_name dscan.dpdns.org;

    # Let's Encrypt ACME challenge (must stay on :80 for renewal)
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dscan.dpdns.org;

    ssl_certificate /www/ssl/dscan.dpdns.org.pem;
    ssl_certificate_key /www/ssl/dscan.dpdns.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/sites/tradecross.com/index;
    index index.html index.htm;

    access_log /www/sites/tradecross.com/log/access.log main;
    error_log /www/sites/tradecross.com/log/error.log;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 172.18.0.4:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. { deny all; }
}
