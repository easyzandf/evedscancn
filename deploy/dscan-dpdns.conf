server {
    listen 80;
    server_name dscan.dpdns.org;

    # Let's Encrypt ACME challenge (must stay on :80 for renewal)
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dscan.dpdns.org;

    ssl_certificate /www/ssl/dscan.dpdns.org.pem;
    ssl_certificate_key /www/ssl/dscan.dpdns.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/sites/tradecross.com/index;
    index index.html index.htm;

    # 首页必须回源校验。没有 Cache-Control 时浏览器走启发式缓存（可复用时长约等于
    # 文件距上次修改时间的 10%），文件躺得越久缓存窗口越大，发布后用户可能长时间
    # 看不到新版。no-cache 是「用之前先校验」，没变仍回 304，不是每次重传整页。
    # 注意 no-cache 与 no-store 不是一回事：后者会连 304 都失去。
    location = / {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /www/sites/tradecross.com/log/access.log main;
    error_log /www/sites/tradecross.com/log/error.log;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 172.18.0.4:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. { deny all; }
}
