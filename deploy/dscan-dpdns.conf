server {
    listen 80;
    server_name dscan.dpdns.org;

    # Let's Encrypt ACME challenge (must stay on :80 for renewal)
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dscan.dpdns.org;

    ssl_certificate /www/ssl/dscan.dpdns.org.pem;
    ssl_certificate_key /www/ssl/dscan.dpdns.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/sites/tradecross.com/index;
    index index.html index.htm;

    # 缓存策略分两类：HTML 入口回源校验，数据文件长缓存。
    #
    # HTML 入口必须回源校验。没有 Cache-Control 时浏览器走启发式缓存（可复用时长约
    # 等于文件距上次修改时间的 10%），文件躺得越久这个窗口越大，发布之后用户可能长
    # 时间看不到新版。no-cache 是「用之前先校验」，没变仍然回 304，不是每次重传整页。
    # 注意 no-cache 与 no-store 不是一回事：后者会连 304 都失去。
    location = / {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /www/sites/tradecross.com/log/access.log main;
    error_log /www/sites/tradecross.com/log/error.log;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 172.18.0.4:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 隐藏文件。必须排在下面那几条正则之前 —— nginx 的正则 location 是「首个匹配
    # 生效」，顺序反过来，/js/.foo.js 就会绕过这条、被当成普通静态文件发出去。
    location ~ /\. { deny all; }

    # 站点目录和旧站共用，目录里躺着 index.php.bak 这类备份。上面的 \.php$ 是正则，
    # 只认 .php 结尾，.bak 匹配不上，于是被当纯文本直接吐出去 —— 等于泄露源码。
    location ~* \.(bak|old|orig|save|swp|swo|sql|log|ini|conf)$ { deny all; }

    # phpinfo 挡不住扩展名（它本身就是个 .php），本站又用不到，单独关掉。
    location = /phpinfo.php { deny all; }

    # 数据文件长缓存。index.html 里引用时都带 ?v=<内容哈希>（stamp_assets.py 生成），
    # 内容一变 URL 就变，所以老访客不会拿到旧数据 —— 换完数据文件记得跑那个脚本。
    # 这里不要另写 add_header Cache-Control：expires 自己就会生成 Expires 和
    # Cache-Control: max-age，两个来源同时写会出现重复头。
    location ~* \.(js|css|png|ico|jpe?g|gif|svg|woff2?)$ {
        expires 7d;
    }
}
