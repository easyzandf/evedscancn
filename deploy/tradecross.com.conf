# 这个 vhost 的 :80 块是全站的 default_server —— 所有没匹配上 server_name 的 Host
# （裸 IP、扫描器、随便指过来的域名）都落到它这里。
#
# server_name 里原来写着 tradecross.com。那个域名已经不在我们手上了：NS 指向
# ns1/ns2.afternic.com，A 记录是 76.223.54.146 / 13.248.169.48 的停靠页。留着它
# 会让配置看起来像我们还在服务这个域名，所以摘掉，改用 _ 显式兜底。
#
# 这个块不能删：旧站的授权接口还在跑，客户端是明文 HTTP 打到 80 端口上的
# （日志里 865 次 POST /api/upload.php 全是 HTTP/1.1，最近一次 2026-09-16）。
# 清理这个文件之前先确认那些客户端已经下线。
server {
    listen 80 default_server;
    server_name _;

    # 网站根目录（容器内部路径，与 PHP 容器挂载一致）
    root /www/sites/tradecross.com/index;

    # 默认首页文件
    index index.php index.html index.htm;

    # 日志
    access_log /www/sites/tradecross.com/log/access.log main;
    error_log /www/sites/tradecross.com/log/error.log;

    # Let's Encrypt 验证
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # 404 错误页
    error_page 404 /404.html;
    location = /404.html {
        root /www/sites/tradecross.com/index;
    }

    # 处理 PHP 请求
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 172.18.0.4:9000;          # PHP 容器 IP 和端口
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 隐藏文件、源码备份、本地库、phpinfo 的拦截（共享片段，见该文件里的说明）
    include /usr/local/openresty/nginx/conf/conf.d/site-protect.inc;
}
# HTTPS server
server {
    listen 443 ssl http2;
    server_name www.tradecross.cc.cd;

    ssl_certificate /www/ssl/www.tradecross.cc.cd.pem;
    ssl_certificate_key /www/ssl/www.tradecross.cc.cd.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/sites/tradecross.com/index;
    index index.php index.html index.htm;

    access_log /www/sites/tradecross.com/log/access.log main;
    error_log /www/sites/tradecross.com/log/error.log;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 172.18.0.4:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    include /usr/local/openresty/nginx/conf/conf.d/site-protect.inc;
}