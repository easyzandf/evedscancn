# 这个文件原来是旧站 tradecross.com 的 vhost。那个站已经下线：域名不在我们手上
# （NS 指向 ns1/ns2.afternic.com，A 记录是停靠页），站点程序和授权接口也一并移出了
# 站点目录，归档在 /home/admin/dscan-backups/<TS>-tradecross-removed/。
#
# 现在它只剩两件事：
#
# 1) :80 的 default_server —— 兜住所有没匹配上 server_name 的 Host（裸 IP、扫描器、
#    随便指过来的域名）。除了 ACME 挑战路径，一律 444 直接断开，不再吐任何内容。
#    ACME 那段不能删：certbot 的 webroot 是 .../openresty/root，在容器里就是
#    /usr/share/nginx/html，www.tradecross.cc.cd 的续期靠这里回挑战文件。
#
# 2) www.tradecross.cc.cd —— 注意这不是 .com，是另一个域名，证书每天 3 点由
#    /etc/cron.d/certbot-tradecross 续期，现在指向 D-Scan 的静态页，所以留着。
server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name www.tradecross.cc.cd;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name www.tradecross.cc.cd;

    ssl_certificate /www/ssl/www.tradecross.cc.cd.pem;
    ssl_certificate_key /www/ssl/www.tradecross.cc.cd.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/sites/tradecross.com/index;
    index index.html index.htm;

    # 与另外两个入口域名保持一致，理由见 dscan-dpdns.conf 里的同类注释。
    location = / {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /www/sites/tradecross.com/log/access.log main;
    error_log /www/sites/tradecross.com/log/error.log;

    # D-Scan 的 API 还在这台机上，所以 PHP 通道保留。
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 172.18.0.4:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    include /usr/local/openresty/nginx/conf/conf.d/site-protect.inc;

    location ~* \.(js|css|png|ico|jpe?g|gif|svg|woff2?)$ {
        expires 7d;
    }
}