# 注意：这个 vhost 实际上选不中 —— 它 listen 80 但没有 default_server，而
# tradecross.com.conf 占了 default_server，server_name 里的 "_" 又匹配不到任何真实
# Host；它声明的 147.139.212.118 与 tradecross.com.conf 重复，启动时那条
# "conflicting server name" 警告就是它，nginx 会忽略后出现的那个。
# 它的 fastcgi_pass 还指向 127.0.0.1:9000（PHP 实际在 172.18.0.4:9000），PHP 本来也跑不起来。
#
# 那为什么还要加固：它的 root 和旧站是同一个目录，所以只要哪天有人给它补上
# default_server 或者把 PHP 地址改对，data/auth_system.db 之类的文件立刻又能被下载。
# 拦截成本是一行 include，那就先放上。
server {
    listen 80;
    server_name _ 147.139.212.118;
    root /www/sites/tradecross.com/index;
    index index.php index.html;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    include /usr/local/openresty/nginx/conf/conf.d/site-protect.inc;
}
