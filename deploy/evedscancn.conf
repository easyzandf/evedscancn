# 同一个应用的第二个入口域名。这份配置以前没跟 dscan-dpdns.conf 对齐，所以
# evedscancn.cc.cd 上的 HTML 还在吃启发式缓存、备份文件也没拦 —— 两个域名行为
# 必须一致，不然「发布后看不到新版」只在其中一个域名上复现，很难查。
server {
    listen 80;
    server_name www.evedscancn.cc.cd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.evedscancn.cc.cd;

    ssl_certificate /www/ssl/evedscancn.cc.cd.pem;
    ssl_certificate_key /www/ssl/evedscancn.cc.cd.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/sites/tradecross.com/index;
    index index.html index.htm;

    # 见 dscan-dpdns.conf 里的同类注释：HTML 入口回源校验，数据文件长缓存。
    location = / {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /www/sites/tradecross.com/log/access.log main;
    error_log /www/sites/tradecross.com/log/error.log;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 172.18.0.4:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    include /usr/local/openresty/nginx/conf/conf.d/site-protect.inc;

    location ~* \.(js|css|png|ico|jpe?g|gif|svg|woff2?)$ {
        expires 7d;
    }
}
